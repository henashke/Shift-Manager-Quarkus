quarkus.http.port=8081
# Database configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/
# Hibernate
quarkus.hibernate-orm.database.generation=none
# Flyway
quarkus.flyway.migrate-at-start=true
# CORS: the frontend is served from the same origin; only needed in dev when opening the React dev server directly
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=*
# Frontend (Quinoa): builds src/main/webui and serves it; in dev mode it runs the React dev server and proxies to it
quarkus.quinoa.build-dir=build
quarkus.quinoa.dev-server.port=3000
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api
# Refresh tokens
auth.refresh-token.lifespan-days=30
