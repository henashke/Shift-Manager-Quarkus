# Safe to commit: secrets come from the environment (locally from the gitignored .env file in the project root)
# Railway injects PORT; locally falls back to 8080
quarkus.http.port=${PORT:8080}
# Gzip responses (the frontend bundle is ~700KB raw, ~200KB compressed; also the API's JSON)
quarkus.http.enable-compression=true
# Database configuration (overridden in deployment by QUARKUS_DATASOURCE_JDBC_URL/USERNAME/PASSWORD)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/
# Hibernate
quarkus.hibernate-orm.database.generation=none
# Flyway
quarkus.flyway.migrate-at-start=true
# JWT keys: locally read from the gitignored src/main/resources/keys/; in deployment passed inline via the
# MP_JWT_VERIFY_PUBLICKEY and SMALLRYE_JWT_SIGN_KEY env vars (a key and its location can't both be set)
%dev.mp.jwt.verify.publickey.location=keys/publicKey.pem
%dev.smallrye.jwt.sign.key.location=keys/privateKey.pem
%test.mp.jwt.verify.publickey.location=keys/publicKey.pem
%test.smallrye.jwt.sign.key.location=keys/privateKey.pem
# Gemini
gemini.api-key=${GEMINI_API_KEY}
suggestion.provider=gemini
gemini.enabled=true
# CORS: the frontend is served from the same origin; only needed in dev when opening the React dev server directly
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=*
# Frontend (Quinoa): builds src/main/webui and serves it; in dev mode it runs the React dev server and proxies to it
quarkus.quinoa.build-dir=build
quarkus.quinoa.dev-server.port=3000
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/oauth,/.well-known,/mcp
# Refresh tokens
auth.refresh-token.lifespan-days=30
# Behind Railway's proxy: trust X-Forwarded-Proto/Host, so URLs built from requests (OAuth and MCP metadata) are https
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
# MCP server (for chat apps: Claude, ChatGPT, Gemini...), at /mcp. Signed in with OAuth (see OAuthService).
quarkus.mcp.server.server-info.name=Shift Manager
quarkus.mcp.server.server-info.instructions=The team's on-call (כוננים) shift schedule. Each day has a DAY (יום) and \
  a NIGHT (לילה) shift; each shift has a REGULAR (כונן) holder and optionally SHADOW (כונן צל) and JUMP (כונן הקפצה). \
  Weeks run Sunday to Saturday. The user is signed in: call whoami for their name and today's date before answering \
  questions about "me" or relative dates. Users write constraints for shifts they can't or prefer not to work; admins \
  build the schedule. Reply in the user's language.
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=authenticated
# Optional: the public base URL, e.g. https://shifts.example.com (APP_PUBLIC_URL); otherwise taken from each request
# app.public-url=
# Refresh tokens of connected chat apps; each use renews it
auth.oauth.refresh-token.lifespan-days=180
