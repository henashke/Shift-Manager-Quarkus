# Safe to commit: secrets come from the environment (locally from the gitignored .env file in the project root)
# Railway injects PORT; locally falls back to 8080
quarkus.http.port=${PORT:8080}
# Gzip responses (the frontend bundle is ~700KB raw, ~200KB compressed; also the API's JSON)
quarkus.http.enable-compression=true
# Database configuration (overridden in deployment by QUARKUS_DATASOURCE_JDBC_URL/USERNAME/PASSWORD)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/
# Hibernate
quarkus.hibernate-orm.database.generation=none
# Flyway
quarkus.flyway.migrate-at-start=true
# JWT keys: locally read from the gitignored src/main/resources/keys/; in deployment passed inline via the
# MP_JWT_VERIFY_PUBLICKEY and SMALLRYE_JWT_SIGN_KEY env vars (a key and its location can't both be set)
%dev.mp.jwt.verify.publickey.location=keys/publicKey.pem
%dev.smallrye.jwt.sign.key.location=keys/privateKey.pem
%test.mp.jwt.verify.publickey.location=keys/publicKey.pem
%test.smallrye.jwt.sign.key.location=keys/privateKey.pem
# Gemini
gemini.api-key=${GEMINI_API_KEY}
suggestion.provider=gemini
gemini.enabled=true
# CORS: the frontend is served from the same origin; only needed in dev when opening the React dev server directly
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=*
# Frontend (Quinoa): builds src/main/webui and serves it; in dev mode it runs the React dev server and proxies to it
quarkus.quinoa.build-dir=build
quarkus.quinoa.dev-server.port=3000
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api
# Refresh tokens
auth.refresh-token.lifespan-days=30
